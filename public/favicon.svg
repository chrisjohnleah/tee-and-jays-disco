<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
	<title id="title">TeeJays Disco</title>
	<rect width="256" height="256" rx="56" fill="#0E0C13" />
	<g transform="translate(128,128)">
		<!-- vinyl disc edge ring -->
		<circle r="104" fill="#0E0C13" stroke="#F4EFE3" stroke-width="4" />
		<!-- dashed lime groove -->
		<circle r="92" fill="none" stroke="#DCFF3F" stroke-width="3" stroke-dasharray="4 6" opacity="0.65" />
		<!-- faint cream grooves -->
		<circle r="76" fill="none" stroke="#F4EFE3" stroke-width="2" opacity="0.28" />
		<circle r="62" fill="none" stroke="#F4EFE3" stroke-width="2" opacity="0.28" />
		<!-- pink center label -->
		<circle r="42" fill="#FF2D7E" stroke="#0E0C13" stroke-width="3" />
		<!-- TJ wordmark -->
		<text x="0" y="10" text-anchor="middle" font-family="Anton, 'Arial Black', Impact, sans-serif" font-size="42" fill="#F4EFE3" font-weight="900" letter-spacing="1.5">TJ</text>
		<!-- spindle hole -->
		<circle r="6" fill="#0E0C13" />
	</g>
</svg>
